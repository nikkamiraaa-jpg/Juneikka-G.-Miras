/* Layout: a live sunset sky (drifting clouds, bobbing sun, glowing fireflies, twinkles) behind soft pink glass panels of tappable cards. Single look by choice. */

<script type="application/json" id="site-data">{"name":"Juneikka","tagline":"Hi, I'm Juneikka Miras! Welcome to my little corner of the internet, where I keep all the things I love, the people I care about, and the dreams I'm working toward.","song":{"title":"My favorite song","artist":"Tap Edit my page, then paste a Spotify link below","url":"https://open.spotify.com/track/6wfb4nI2Vih263JqC8WSoW?si=eEwAEyWFQjmqEb5Hc669Ew&utm_source=copy-link"},"sections":[{"id":"about","title":"All about me","items":[{"e":"🎂","t":"Age","d":"I'm a 14-year-old girl, and I'll be turning 15 on October 30. I was born in 2011."},{"e":"🎒","t":"School","d":"I'm a student at MOGCHS."},{"e":"📚","t":"Favorite subject","d":"I don't really have a favorite subject. Whether I like one depends on whether I understand the lesson or not."},{"e":"🍳","t":"Favorite food","d":"I love eating, and eggs are my favorite food by far."},{"e":"💧","t":"Favorite drinks","d":"My favorite drinks are plain water and Royale."}]},{"id":"likes","title":"Things I like","items":[{"e":"🎮","t":"Video games","d":"I love playing video games like Roblox and COD, but Mobile Legends is my absolute favorite. Playing is so much more fun when I'm with my friends."},{"e":"💪","t":"Exercising","d":"I love exercising because it's so much fun to move my body and try different types of exercises. It also helps me lessen my stress."},{"e":"🚲","t":"Night cycling","d":"I especially love cycling at night because it's so peaceful and quiet. It's also very windy, which makes the ride feel even better."},{"e":"🌿","t":"Being outside","d":"Being outside feels very nice and peaceful to me. It makes me appreciate God's beautiful creation, and I love going to places where there are no people."},{"e":"📸","t":"Taking pictures","d":"Every time I see something beautiful and nice, I take a picture of it. I love noticing the beauty in the world."},{"e":"🏎️","t":"Watching vehicles","d":"I love watching vehicles outside, especially unique ones. When I see a nice, exotic-looking vehicle, I wish I could have one too."},{"e":"🌙","t":"The moon","d":"I love the moon. There's just something so special and beautiful about it."},{"e":"🐾","t":"Pets","d":"I love taking care of all kinds of pets, and I talk to them and treat them like a person. They look so cute, and whenever I talk to them, I think they understand me. They make me very happy, and they're part of the reason I'd like to become a vet someday."},{"e":"😄","t":"Making people happy","d":"I like making people happy and making them laugh. I really care about the people around me."}]},{"id":"dreams","title":"My dreams","items":[{"e":"🏆","t":"In Mobile Legends","d":"My dream in Mobile Legends is to reach Mythical Immortal. It's more fun to chase that dream with my friends."},{"e":"🐶","t":"For my future","d":"I'm not completely sure about my future yet. But my ambition is probably to become a vet, because I love taking care of any kind of pet."}]},{"id":"people","title":"My people","items":[{"e":"🏡","t":"Family","d":"I really love my family, and I care about them a lot. I'm glad to have siblings and amazing parents. It makes me happy when I don't see my parents arguing."},{"e":"🤝","t":"Friends","d":"I care about my friends so much. I thank Jesus for bringing them into my life, and playing games with them makes everything more fun."},{"e":"🍎","t":"Teachers","d":"I love my teachers because they're so hardworking and responsible. I really appreciate everything they do."},{"e":"💗","t":"Everyone","d":"I also like the people I see around me, because every person Jesus created is beautiful and handsome. I really do care about people, even if it may not always seem like it."}]},{"id":"dislikes","title":"Things I don't like","items":[{"e":"😤","t":"Feeling superior","d":"I don't like it when someone feels superior or acts narcissistic. But I don't really hate people, because I understand there's always a reason someone is like that."},{"e":"💸","t":"Money","d":"I don't like money because it's often the reason people fight. But I also know it can help me sometimes, so it's not all bad."},{"e":"🌧️","t":"Failing","d":"I really don't like seeing myself fail or disappointing the people around me."},{"e":"🙏","t":"Sin","d":"I don't like committing sin when I know God really loves me. Even so, I sometimes keep being disobedient."}]},{"id":"faith","title":"My faith","items":[{"e":"✝️","t":"Jesus","d":"I really love Jesus because He's the only God who understands all my problems. He's a great God, and I appreciate everything He made. I'm thankful for this beautiful world and for all the beautiful people I've come to see."},{"e":"⛪","t":"Going to church","d":"I really like going to church. I enjoy learning new things from the New Testament there."}]}],"closing":"I don't really hate anything in this world, because I've come to love it.","footer":"","font":"chunky","thick":2}</script>

      function starfish(cx, cy, r, col) {
        c.fillStyle = col; c.beginPath();
        for (var q = 0; q < 10; q++) { var rr = q % 2 ? r * 0.45 : r, aa = -1.5708 + q * 0.6283; c.lineTo(cx + Math.cos(aa) * rr, cy + Math.sin(aa) * rr); }
        c.closePath(); c.fill();

      }
      starfish(W * 0.58, H * 0.93, Math.max(9, u * 0.022), '#ff9ab8');
      starfish(W * 0.84, H * 0.88, Math.max(7, u * 0.016), '#ffb48a');
      c.fillStyle = '#ffe6f0'; c.strokeStyle = '#f2a8c4'; c.lineWidth = 1.2;
      c.beginPath(); c.ellipse(W * 0.72, H * 0.955, Math.max(8, u * 0.018), Math.max(6, u * 0.013), -0.3, 0, 6.2832); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(W * 0.47, H * 0.885, Math.max(6, u * 0.013), Math.max(5, u * 0.01), 0.4, 0, 6.2832); c.fill(); c.stroke();
      /* girl on a bike along the shore */
      if (!reduce) {
        if (bike.x < -70 && bike.wait > 0) { bike.wait -= dt; if (bike.wait <= 0) bike.x = -60; }
        else { bike.x += 34 * dt; bike.wheel += dt * 5; if (bike.x > W + 60) { bike.x = -80; bike.wait = rnd(5, 12); } }
        if (bike.x > -60 && bike.x < W + 60) drawBike(tt, s);
      }
      /* daisies */
      for (i = 0; i < daisies.length; i++) drawDaisy(c, daisies[i], tt);
      /* fireflies and sparkles */
      var fk = 0.25 + 0.75 * s;
      for (i = 0; i < glows.length; i++) {
        o = glows[i];
        if (!reduce) { o.y -= o.vy; if (o.y < -12) { o.y = H + 12; o.x = rnd(0, W); } }
        var px = o.x + Math.sin(tt * 0.6 + o.ph) * o.sw;
        a = fk * (0.35 + 0.45 * (0.5 + 0.5 * Math.sin(tt * 1.3 + o.ph)));
        g = c.createRadialGradient(px, o.y, 0, px, o.y, o.r * 4);
        g.addColorStop(0, 'rgba(255,236,170,' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,210,120,0)');
        c.fillStyle = g; c.beginPath(); c.arc(px, o.y, o.r * 4, 0, 6.2832); c.fill();
        if (i % 3 === 0) {
          c.save(); c.globalAlpha = Math.min(1, a * 1.6); c.fillStyle = i % 2 ? '#ffffff' : '#ff8fb8';

    }
    function size() {
      var w = window.innerWidth, h = window.innerHeight, wChanged = w !== W;
      bdpr = Math.min(window.devicePixelRatio || 1, 1.5); tdpr = Math.min(window.devicePixelRatio || 1, 2);
      W = w; H = h;
      bg.width = W * bdpr; bg.height = H * bdpr; bg.style.width = W + 'px'; bg.style.height = H + 'px';
      top.width = W * tdpr; top.height = H * tdpr; top.style.width = W + 'px'; top.style.height = H + 'px';
      bctx.setTransform(bdpr, 0, 0, bdpr, 0, 0); tctx.setTransform(tdpr, 0, 0, tdpr, 0, 0);
      if (wChanged || !stars.length) seed();
      drawScene(performance.now(), 0);
    }
    function bgLoop(t) {
      var dt = Math.min(0.1, (t - last) / 1000 || 0); last = t;
      drawScene(t, dt);
      requestAnimationFrame(bgLoop);
    }
    function topLoop() {
      tctx.clearRect(0, 0, W, H);
      var alive = [];
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.vy += 0.08; p.x += p.vx; p.y += p.vy; p.life -= 0.017;
        if (p.life > 0) {
          tctx.globalAlpha = Math.max(0, p.life);
          tctx.fillStyle = p.c;

          tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
          tctx.fillText(p.g, p.x, p.y);

      }
      tctx.globalAlpha = 1;
      parts = alive;
      if (parts.length) topRaf = requestAnimationFrame(topLoop);
      else { topRaf = 0; tctx.clearRect(0, 0, W, H); }
    }
    function burst(x, y, n, glyphs, big) {
      if (reduce) return;
      var cols = ['#ffffff', '#ff6b9a', '#ffd27a', '#ff8f5a'];
      for (var i = 0; i < n; i++) {
        var ang = rnd(0, 6.2832), sp = rnd(1.5, big ? 5 : 3.5);
        parts.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2, life: 1, g: glyphs[(Math.random() * glyphs.length) | 0], c: cols[(Math.random() * cols.length) | 0], s: rnd(12, big ? 28 : 20) });
      }
      if (!topRaf) topRaf = requestAnimationFrame(topLoop);

    size();
    window.addEventListener('resize', size);
    if (!reduce) requestAnimationFrame(bgLoop);

  })();

  
  /* ---------- markup ---------- */
  function songHtml() {
    var s = S.song, url = safeUrl(s.url);
    if (edit) {
      return '<div class="song"><div class="disc" aria-hidden="true"></div><div class="song-fields">' +
        '<p class="song-label">My song</p>' +
        '<input class="field" id="song-title" data-p="song.title" placeholder="Song title" value="' + esc(s.title) + '">' +
        '<input class="field" id="song-artist" data-p="song.artist" placeholder="Artist" value="' + esc(s.artist) + '">' +
        '<input class="field" id="song-url" data-p="song.url" placeholder="Paste your Spotify link here" inputmode="url" value="' + esc(s.url) + '">' +
        '<p class="song-artist">In Spotify, open your song, tap the three dots, then Share, then Copy link.</p>' +
        '</div></div>';
    }
    return '<div class="song"><div class="disc" aria-hidden="true"></div><div class="song-text">' +
      '<p class="song-label">Now playing</p><p class="song-title">' + esc(s.title) + '</p><p class="song-artist">' + esc(s.artist) + '</p></div>' +
      (url ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Listen on Spotify</a>' : '') + '</div>';
  }

  function sectionHtml(sec, si) {
    var h = '<section class="panel" id="sec-' + si + '">' + ce('sections.' + si + '.title', sec.title, 'h2', '') + '<div class="grid">';
    sec.items.forEach(function (it, ii) {
      var p = 'sections.' + si + '.items.' + ii, k = sec.id + '.' + ii, on = !!loved[k];
      h += '<article class="item">' + ce(p + '.e', it.e || '✨', 'span', 'emo') +
        '<div class="body">' + ce(p + '.t', it.t, 'span', 't') + ce(p + '.d', it.d, 'span', 'd') + '</div>' +
        (edit
          ? '<button class="mini" data-act="del-item" data-s="' + si + '" data-i="' + ii + '">Remove this</button>'
          : '<button class="heart' + (on ? ' on' : '') + '" data-act="heart" data-k="' + esc(k) + '" aria-pressed="' + on + '" aria-label="Love this">' + (on ? '♥' : '♡') + '</button>') +
        '</article>';
    });
    h += '</div>';
    if (edit) {
      h += '<button class="add" data-act="add-item" data-s="' + si + '">Add something</button>' +
        '<div class="sec-tools"><button class="mini" data-act="del-sec" data-s="' + si + '">Remove this whole section</button></div>';
    }
    return h + '</section>';
  }

  function navHtml() {
    var h = '<nav class="nav" aria-label="Sections"><div class="chips">';
    S.sections.forEach(function (sec, si) { h += '<button class="chip" data-act="go" data-s="' + si + '">' + esc(sec.title) + '</button>'; });
    return h + '</div><span class="count" id="count" title="Hearts you gave">♥ ' + lovedCount() + '</span></nav>';
  }

  function dockHtml() {
    if (!A) return '';
    if (!edit) return '<div class="dock"><button class="btn" data-act="edit">Edit my page</button></div>';
    return '<div class="dock"><button class="btn" data-act="add-sec">New section</button>' +
      '<button class="btn ghost" data-act="cancel">Cancel</button>' +
      '<button class="btn" data-act="save"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Saving...' : 'Save') + '</button></div>';
  }

  function render() {
    document.body.classList.toggle('editing', edit);
    var h = '<div class="sky" aria-hidden="true"></div>';
    h += '<main class="wrap"><button class="moon" data-act="wish" aria-label="Make a wish on the moon"></button><p class="moon-tip">make a wish</p>' +
      '<header class="hero"><div class="herocard"><p class="eyebrow">my little corner of the internet</p>' +
      ce('name', S.name, 'h1', '') + ce('tagline', S.tagline, 'p', 'tagline') +
      (edit ? '' : '<p class="into">Right now I\'m into <span class="rot" id="rot">' + esc(INTO[0]) + '</span></p>') +
      '</div>' + songHtml() + '</header>';
    if (edit) h += '<p class="hint">Tap any text to change it. You can type your own emoji in the little circles. When you are done, press Save.</p>';
    else h += navHtml();
    S.sections.forEach(function (sec, si) { h += sectionHtml(sec, si); });
    h += ce('closing', S.closing, 'p', 'closing') + ce('footer', S.footer, 'p', 'foot') + '</main>' + fontHtml() + dockHtml();
    app.innerHTML = h;
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4000);
  }

  var rotI = 0;
  setInterval(function () {
    var el = document.getElementById('rot');
    if (!el) return;
    rotI = (rotI + 1) % INTO.length;
    el.textContent = INTO[rotI];
    el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade');
  }, 2600);

  function wish(btn) {
    var r = btn.getBoundingClientRect();
    var s = document.createElement('div');
    s.className = 'shoot';
    s.style.left = (r.left + r.width / 2) + 'px';
    s.style.top = (r.top + r.height / 2) + 'px';
    s.addEventListener('animationend', function () { s.remove(); });
    document.body.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.remove(); }, 1500);
    fxApi.burst(r.left + r.width / 2, r.top + r.height / 2, 14, ['✦', '✧', '★'], true);
    toast(WISHES[(Math.random() * WISHES.length) | 0]);
  }

  function buildDoc() {
    var css = document.getElementById('app-style').textContent;
    var code = document.getElementById('app-code').textContent;
    S.font = fontId; S.thick = thick; var json = JSON.stringify(S).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>Juneikka\'s Sunset</title>' +
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Yellowtail&family=Pacifico&family=Quicksand:wght@500;700&family=Dancing+Script:wght@600;700&family=Caveat:wght@600;700&family=Fredoka:wght@400;600;700&family=Baloo+2:wght@500;700;800&family=Lilita+One&family=Chewy&family=Shrikhand&family=Permanent+Marker&family=Sniglet:wght@800&family=Titan+One&family=Luckiest+Guy&family=Bowlby+One&display=swap">' +
      '<style id="app-style">' + css + '</style><div id="app"></div>' +
      '<script type="application/json" id="site-data">' + json + '<\/script>' +
      '<script id="app-code">' + code + '<\/script></body></html>';
  }

  function save() {
    if (busy) return;
    busy = true; render();
    A.publish(buildDoc()).then(function () {
      toast('Saved!');
    }).catch(function (e) {
      busy = false; render();
      var c = e && e.code;
      if (c === 'not_writer' || c === 'not_granted') toast('Only the owner of this page can save changes.');
      else if (c === 'conflict') toast('The page was updated somewhere else. It is reloading with the newest version.');
      else toast('Could not save. Please try again in a moment.');
    });
  }

  /* ---------- events ---------- */
  app.addEventListener('input', function (e) {

    if (!e.target.isContentEditable) return;

    var txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g, ' ');
    document.execCommand('insertText', false, txt);
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.isContentEditable) e.preventDefault();
  });
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('[contenteditable],input,.moon,.heart')) return;
    fxApi.burst(e.clientX, e.clientY, 7, ['✦', '♥', '✧']);
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act, s = +b.dataset.s, i = +b.dataset.i;
    if (act === 'edit') { edit = true; render(); window.scrollTo(0, 0); }
    else if (act === 'cancel') { S = JSON.parse(dataEl.textContent); edit = false; render(); }
    else if (act === 'save') save();
    else if (act === 'wish') wish(b);
    else if (act === 'heart') {
      var k = b.dataset.k, r = b.getBoundingClientRect(), on = !loved[k];
      if (on) loved[k] = 1; else delete loved[k];
      saveLoved();
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
      b.textContent = on ? '♥' : '♡';
      var c = document.getElementById('count'); if (c) c.textContent = '♥ ' + lovedCount();
      if (on) fxApi.burst(r.left + r.width / 2, r.top + r.height / 2, 9, ['♥', '♥', '✦'], true);
    }
    else if (act === 'go') {
      var t = document.getElementById('sec-' + s);
      if (t) t.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    }
    else if (act === 'font-toggle') { fontOpen = !fontOpen; render(); }
    else if (act === 'font-pick') { applyFont(b.dataset.f); try { localStorage.setItem('jm-font', fontId); } catch (er) {} render(); }
    else if (act === 'thick-pick') { applyThick(+b.dataset.t); try { localStorage.setItem('jm-thick', String(thick)); } catch (er) {} render(); }
    else if (act === 'font-save') save();
    else if (act === 'add-item') { S.sections[s].items.push({ e: '✨', t: 'New thing', d: 'Tell me about it.' }); render(); }
    else if (act === 'del-item') { S.sections[s].items.splice(i, 1); render(); }
    else if (act === 'add-sec') { S.sections.push({ id: 's' + Date.now(), title: 'New section', items: [{ e: '✨', t: 'New thing', d: 'Tell me about it.' }] }); render(); window.scrollTo(0, document.body.scrollHeight); }
    else if (act === 'del-sec') { S.sections.splice(s, 1); render(); }
  });

  render();
  setTimeout(function () { app.classList.add('settled'); }, 1200);
  try {
    if (window.claude && window.claude.use) {

    }
  } catch (err) {}
